metadata:
    name: lmp-device-token-header
    format: "Manual Test Definition 2.0"
    description: "Register device with api token header"
    maintainer:
        - brendan.wood@foundries.io
    environment:
        - manual-test

run:
    steps:
        - Boot up the device
        - Ensure device is not registered to a factory
          Check /var/sota/sql.db is not present on device
        - Create valid api token on app.foundries.io with "devices:create" for <factory>
        - Run "lmp-device-register -T <valid-api-token> -H OSF-TOKEN -n <name>"

    expected:
        - Device should register normally

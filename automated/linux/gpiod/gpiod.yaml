metadata:
    name: gpiod
    format: "Lava-Test Test Definition 2.0"
    description: "Run a gpiod suite"
    maintainer:
        - anders.roxell@linaro.org
        - chase.qi@linaro.org
    dependency_path:
        - /automated/lib/*
        - /automated/utils/*
params:
    GPIOD_PATH: "/opt/libgpiod/bin/"

run:
    steps:
        - cd ./automated/linux/gpiod
        - ./gpiod.sh ${GPIOD_PATH}
        - ../../utils/send-to-lava.sh result.txt

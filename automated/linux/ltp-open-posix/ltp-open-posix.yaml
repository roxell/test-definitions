metadata:
    name: ltp-open-posix
    format: "Lava-Test Test Definition 1.0"
    description: >-
        Run LTP open posix test suite. An empty GRP_TEST runs the
        conformance, functional and stress suites, from the source tree if
        it is there, else from the installed suite under /opt/ltp.
    maintainer:
        - naresh.kamboju@linaro.org
    os:
        - debian
        - fedora
        - openembedded
    scope:
        - functional
    devices:
        - dragonboard410c
        - hi6220-hikey
        - juno
        - x15
        - x86
    environment:
        - lava-test-shell
params:
    # LTP version
    LTP_VERSION: 20180515
    SKIP_INSTALL: true
    # Run Option Group Feature Tests. Available Groups are AIO, MEM, MSG, SEM, SIG, THR, TMR, TPS
    GRP_TEST: ""

run:
    steps:
        - cd ./automated/linux/ltp-open-posix/
        - ./ltp-open-posix.sh -s "${SKIP_INSTALL}" -v "${LTP_VERSION}" -t "${GRP_TEST}"
        - ../../utils/send-to-lava.sh ./output/result.txt

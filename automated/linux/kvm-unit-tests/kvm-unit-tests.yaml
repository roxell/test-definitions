metadata:
    name: kvm-unit-tests
    format: "Lava-Test Test Definition 2.0"
    description: "Build and run kvm-unit-tests natively"

    maintainer:
        - naresh.kamboju@linaro.org
    environment:
        - lava-test-shell
    dependency_path:
        - /automated/lib/*
        - /automated/utils/*

params:
    SKIP_INSTALL: "False"
    SMP: "true"
    GIT_REF: "master"

run:
    steps:
        - cd ./automated/linux/kvm-unit-tests/
        - ./kvm-unit-tests.sh -s "${SKIP_INSTALL}" -m "${SMP}" -g "${GIT_REF}"
        - ../../utils/send-to-lava.sh ./output/result.txt

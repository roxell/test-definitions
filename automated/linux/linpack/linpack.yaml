metadata:
    format: Lava-Test Test Definition 2.0
    name: linpack
    description: "Linpack benchmark calculates fLoating point operations per
                  second(FLOPS)."
    maintainer:
        - chase.qi@linaro.org
    dependency_path:
        - /automated/lib/*
        - /automated/utils/*

params:
    ARRAY_SIZE: "200"

run:
    steps:
        - cd ./automated/linux/linpack/
        - ./linpack.sh -a "${ARRAY_SIZE}"
        - ../../utils/send-to-lava.sh ./output/result.txt

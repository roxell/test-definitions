metadata:
    name: bionic-benchmarks-with-units
    format: "Lava-Test Test Definition 2.0"
    description: "Collect the bionic-benchmarks data and try to analyse it."
    maintainer:
        - daniel.diaz@linaro.org
    environment:
        - lava-test-shell
    dependency_path:
        - /automated/lib/*
        - /automated/utils/*

params:
    LOOPS: "1"

run:
    steps:
        - cd ./automated/android/bionic-benchmarks/
        - ./bionic-benchmarks.sh -l "${LOOPS}"
        - ../../utils/send-to-lava.sh ./output/result.txt
